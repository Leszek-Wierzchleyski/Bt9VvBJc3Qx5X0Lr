services:
  apziva-trading:
    build: .
    ports:
      - "8502:8502"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      APZIVA_CONFIG_SPREADSHEET_ID: ${APZIVA_CONFIG_SPREADSHEET_ID}
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
      LLAMA_MODEL_PATH: /app/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    volumes:
      - ${GOOGLE_SERVICE_ACCOUNT_FILE}:/run/secrets/google_service_account:ro
      - ./models:/app/models:ro
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    restart: unless-stopped
